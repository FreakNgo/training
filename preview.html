<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Gallery</title>
<style>body { margin: 0; overflow: hidden; background: #000; }</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="info"></div>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

scene.background = new THREE.Color(0x14141a);
camera.position.set(0, 1.5, 9);

const projects = [
  { title: 'Aurora', cat: 'Web', url: 'https://aurora.com' },
  { title: 'Pulse', cat: 'App', url: 'https://pulseapp.com' },
  { title: 'Nimbus', cat: 'Brand', url: 'https://nimbusbrand.com' },
  { title: 'Vertex', cat: 'Web', url: 'https://vertex.com' },
  { title: 'Lumen', cat: 'App', url: 'https://lumenapp.com' },
  { title: 'Atlas', cat: 'Brand', url: 'https://atlasbrand.com' },
  { title: 'Orbit', cat: 'Web', url: 'https://orbit.com' }
];

function makeCard(x, project) {
  const card = document.createElement('div');
  card.style.cssText = 'position:absolute;left:' + x + 'vw;top:20vh;width:20vw;height:30vh;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#fff;font-family:sans-serif;';
  const img = document.createElement('img');
  img.src = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/textures/project_' + project.cat.toLowerCase() + '.jpg';
  img.alt = project.title;
  img.style.width = '100%';
  img.style.height = '100%';
  img.style.objectFit = 'cover';
  card.appendChild(img);
  const name = document.createElement('p');
  name.textContent = project.title;
  name.style.margin = '0.5em 0 0 0';
  name.style.fontWeight = 'bold';
  card.appendChild(name);
  document.body.appendChild(card);
  return card;
}

const cards = projects.slice(0, 7).map((project, i) => makeCard(i * 3 - 6, project));

const hint = document.getElementById('info');
hint.innerHTML = '<a href="https://threejs.org" target="_blank">Three.js</a> portfolio gallery<br>Use the arrow keys to browse';

let index = 3;
cards[index].style.transform = 'scale(1.2)';
cards[index].querySelector('a').style.display = 'block';

window.addEventListener('keydown', (event) => {
  if (event.code === 'ArrowLeft' && index > 0 || event.code === 'ArrowRight' && index < 6) {
    cards[index].style.transform = '';
    cards[index].querySelector('a').style.display = 'none';
    index += event.code === 'ArrowLeft' ? -1 : 1;
    cards[index].style.transform = 'scale(1.2)';
    cards[index].querySelector('a').style.display = 'block';
    hint.textContent = projects[index].title + ' | ' + projects[index].cat + ' | <a href="' + projects[index].url + '" target="_blank">Visit site</a>';
  }
});

renderer.setAnimationLoop(() => {
  camera.position.x += (index * 3 - camera.position.x) * 0.05;
  renderer.render(scene, camera);
});

</script>
</body>
</html>
